[project]
name = "automated_radiology_protocol_labeling"
version = "0.1.0"
description = "Automate radiology protocol labelling from clinical notes, as tables in Facthory."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0",
    "pyarrow>=17",
]

[project.scripts]
automated_radiology_protocol_labeling = "automated_radiology_protocol_labeling.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automated_radiology_protocol_labeling"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
